<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COAPRE 績效管理系統</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #F8F9FA;
      color: #263A39;
    }

    /* 左側選單 */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      height: 100vh;
      background: #FFFFFF;
      border-right: 1px solid #DCE5E4;
      padding: 28px 18px;
    }

    .brand {
      margin-bottom: 36px;
      padding: 0 12px;
    }

    .brand-title {
      color: #30BAB3;
      font-size: 22px;
      font-weight: 700;
    }

    .brand-subtitle {
      margin-top: 6px;
      color: #6F7D7C;
      font-size: 13px;
    }

    .menu-item {
      display: block;
      padding: 13px 16px;
      margin-bottom: 6px;
      border-radius: 8px;
      color: #263A39;
      text-decoration: none;
      font-size: 15px;
    }

    .menu-item:hover {
      background: #F1F4F3;
    }

    .menu-item.active {
      background: #E7F7F6;
      color: #219691;
      font-weight: 700;
    }

    /* 主要內容 */
    .main {
      margin-left: 240px;
      min-height: 100vh;
    }

    /* 上方標題列 */
    .topbar {
      height: 72px;
      background: #FFFFFF;
      border-bottom: 1px solid #DCE5E4;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .topbar-title {
      font-size: 20px;
      font-weight: 700;
      color: #123B3A;
    }

    .topbar-user {
      color: #6F7D7C;
      font-size: 14px;
    }

    /* Dashboard */
    .content {
      padding: 32px;
    }

    .page-title {
      margin: 0 0 6px;
      font-size: 26px;
      color: #123B3A;
    }

    .page-description {
      margin: 0 0 28px;
      color: #6F7D7C;
    }

    /* KPI 卡片 */
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 28px;
    }

    .card {
      background: #FFFFFF;
      border: 1px solid #DCE5E4;
      border-radius: 12px;
      padding: 22px;
    }

    .card-label {
      color: #6F7D7C;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card-value {
      color: #123B3A;
      font-size: 30px;
      font-weight: 700;
    }

    .card-note {
      margin-top: 8px;
      color: #6F7D7C;
      font-size: 13px;
    }

    /* 區塊 */
    .panel {
      background: #FFFFFF;
      border: 1px solid #DCE5E4;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }

    .panel-title {
      margin: 0 0 18px;
      font-size: 18px;
      color: #123B3A;
    }

    /* 進度條 */
    .progress {
      width: 100%;
      height: 12px;
      background: #E8EEEE;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar {
      width: 83.3%;
      height: 100%;
      background: #30BAB3;
    }

    .progress-text {
      margin-top: 10px;
      color: #219691;
      font-weight: 700;
    }

    /* 待辦事項 */
    .todo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid #EDF1F1;
    }

    .todo:last-child {
      border-bottom: none;
    }

    .todo-title {
      font-weight: 700;
    }

    .todo-note {
      margin-top: 5px;
      color: #6F7D7C;
      font-size: 13px;
    }

    .button {
      border: none;
      border-radius: 7px;
      background: #30BAB3;
      color: white;
      padding: 9px 16px;
      cursor: pointer;
      font-weight: 700;
    }

    .button:hover {
      background: #43C6BF;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <div class="brand">
      <div class="brand-title">COAPRE</div>
      <div class="brand-subtitle">績效管理系統</div>
    </div>

    <nav>
      <a class="menu-item active" href="#">首頁儀表板</a>
      <a class="menu-item" href="#">工作績效</a>
      <a class="menu-item" href="#">績效填報</a>
      <a class="menu-item" href="#">月報管理</a>
      <a class="menu-item" href="#">人員管理</a>
      <a class="menu-item" href="#">系統設定</a>
    </nav>

  </aside>

  <main class="main">

    <header class="topbar">

      <div class="topbar-title">
        COAPRE 績效管理系統
      </div>

      <div class="topbar-user">
        民國115年度
      </div>

    </header>

    <div class="content">

      <h1 class="page-title">績效總覽</h1>

      <p class="page-description">
        掌握本年度 KPI 執行及每月回報情形
      </p>

      <section class="cards">

        <div class="card">
          <div class="card-label">KPI 總數</div>
          <div class="card-value">42</div>
          <div class="card-note">本年度列管 KPI</div>
        </div>

        <div class="card">
          <div class="card-label">本月已回報</div>
          <div class="card-value">35</div>
          <div class="card-note">已完成績效填報</div>
        </div>

        <div class="card">
          <div class="card-label">本月未回報</div>
          <div class="card-value">7</div>
          <div class="card-note">尚待完成填報</div>
        </div>

        <div class="card">
          <div class="card-label">本月回報率</div>
          <div class="card-value">83.3%</div>
          <div class="card-note">35 / 42 項</div>
        </div>

      </section>

      <section class="panel">

        <h2 class="panel-title">本月填報進度</h2>

        <div class="progress">
          <div class="progress-bar"></div>
        </div>

        <div class="progress-text">
          已完成 83.3%
        </div>

      </section>

      <section class="panel">

        <h2 class="panel-title">待辦事項</h2>

        <div class="todo">

          <div>
            <div class="todo-title">尚有 7 項 KPI 未完成回報</div>
            <div class="todo-note">
              請確認本月各項工作執行情形
            </div>
          </div>

          <button class="button">
            前往填報
          </button>

        </div>

      </section>

    </div>

  </main>

</body>
</html>
